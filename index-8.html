const IDB=new Promise((res,rej)=>{const q=indexedDB.open('tg',1);q.onupgradeneeded=()=>q.result.createObjectStore('ph',{keyPath:'id',autoIncrement:true}).createIndex('p','pid');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});IDB.catch(()=>0);
const tx=(m,f)=>IDB.then(db=>new Promise((res,rej)=>{const t=db.transaction('ph',m),r=f(t.objectStore('ph'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)}));
const ymd=ms=>{const d=new Date(ms||Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
async function shrink(f){const bm=await createImageBitmap(f),k=Math.min(1,1200/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.8))}
function photos(id){const p=all().find(x=>x.id==id);if(!p)return home();const lb=(t,cap)=>'<label class="b'+(cap?' o':'')+'" style="flex:1;display:flex;align-items:center;justify-content:center;min-height:52px;text-align:center;cursor:pointer">'+t+'<input type="file" accept="image/*" '+(cap?'capture="environment" ':'multiple ')+'hidden onchange="addPh(\''+id+'\',this)"></label>';return wrap('<div class="bar"><a class="lk" href="#/p/'+id+'">&larr; '+nm(p)+'</a></div><p class="lab" style="margin-top:12px">Photos</p><h1>'+nm(p)+'</h1><p class="it">'+sub(p)+'</p>'+dvd+'<div style="display:flex;gap:10px">'+lb('From gallery',0)+lb('Take photo',1)+'</div><p class="nt" id="phn" style="margin-top:12px">Loading...</p><div id="phg" class="pg2"></div>')}
async function loadPh(id){try{const a=(await tx('readonly',s=>s.index('p').getAll(id))).sort((x,y)=>x.d<y.d?1:-1);$('phn').textContent=T(a.length?a.length+' photo'+(a.length>1?'s':'')+', newest first':'No photos yet. Add the first one above.');$('phg').innerHTML=tr(a.map(z=>'<figure><img alt="Photo '+z.d+'" src="'+URL.createObjectURL(z.blob)+'" onclick="big(this.src)"><figcaption>'+z.d+'</figcaption><button class="b o" style="width:100%" onclick="delPh(\''+id+'\','+z.id+')">Delete</button></figure>').join(''))}catch(e){$('phn').textContent=T('Photos are not available in this browser.')}}
async function addPh(id,inp){const fs=[...inp.files];if(!fs.length)return;$('phn').textContent=T('Saving '+fs.length+' photo'+(fs.length>1?'s':'')+'...');try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();for(const f of fs){const b=await shrink(f);await tx('readwrite',s=>s.add({pid:id,d:ymd(f.lastModified),blob:b}))}}catch(e){alert(T('Could not save the photo'))}inp.value='';loadPh(id)}
function delPh(id,k){if(confirm(T('Delete this photo?')))tx('readwrite',s=>s.delete(k)).then(()=>loadPh(id))}
function big(src){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center';d.innerHTML='<img src="'+src+'" style="max-width:100%;max-height:100%">';d.onclick=()=>d.remove();document.body.appendChild(d)}

et')+'</span>')+(tt.n||!MN[p.k]?'':' <span class="tag">TYPICAL</span>')+E('n')+'</div>'+(p.x?'<div class="k">Plants</div><div class="v">'+p.x+'</div>':'')+'</div></div><div class="sec"><p class="lab">Fruit &amp; use</p>'+dvd+'<p class="nt">'+s.u+'</p></div><div class="sec"><p class="lab">Care</p>'+dvd+'<div class="st"><div class="rn">&bull;</div><div><p class="sl">Watering<span class="tag">SAMPLE</span></p><p class="sx">Check every '+wInt(p)+' days. If the top 3-5 cm of soil is dry, water: '+wAmt(p)+'. Last: '+(D.w[id]||'—')+' · Next: '+when(dueW(p))+'</p></div></div><div class="st"><div class="rn">&bull;</div><div><p class="sl">Fertilizer<span class="tag">SAMPLE</span></p><p class="sx">Yara Mila 12-11-18, about '+dose(p)+' every '+(p.loc=='G'?'3 months':'8 weeks')+'. Soil only, never in drought or flooding. Start low. Last: '+(D.f[id]||'—')+' · Next: '+when(dueF(p))+'</p></div></div><div class="st"><div class="rn">&bull;</div><div><p class="sl">Repotting &amp; moves</p><p class="sx">'+(lr?'Last: '+lr.d+', '+lr.a+' &rarr; '+lr.b:'None logged. Use Edit next to Location when you repot.')+'</p></div></div><div class="st"><div class="rn">&bull;</div><div><p class="sl">Pruning'+(tt.pr||!PX[p.k]?'':'<span class="tag">TYPICAL</span>')+'</p><p class="sx">'+(tt.pr?U(tt.pr):PX[p.k]?U(PR[PX[p.k].c][LG]):dm+'set</span>')+' <button class="lk" onclick="editX(\''+id+'\',\'pr\')">Edit</button></p></div></div><div class="st"><div class="rn">&bull;</div><div><p class="sl">Soil pH'+(tt.ph||!PX[p.k]?'':'<span class="tag">TYPICAL</span>')+'</p><p class="sx">'+U(tt.ph||(PX[p.k]?PX[p.k].ph:''))+(tt.ph||PX[p.k]?'':dm+'set</span>')+' <button class="lk" onclick="editX(\''+id+'\',\'ph\')">Edit</button></p></div></div></div><div class="sec"><p class="lab">Fruit season</p>'+dvd+bars(s.m)+'</div><div class="sec"><p class="lab">Growth</p>'+dvd+chart(id)+'<button class="ad" onclick="addM(\''+id+'\')">Add measurement (cm)</button></div><div class="sec"><p class="lab">Good to know</p>'+dvd+(D.g[id]?'<p class="nt" style="white-space:pre-wrap">'+U(D.g[id])+'</p>':'<p class="nt">Nothing yet.</p>')+'<button class="ad" onclick="editG(\''+id+'\')">'+(D.g[id]?'Edit':'Write a tip')+'</button></div><div class="sec"><p class="lab">Notes</p>'+dvd+(ns.length?ns.map((z,i)=>'<div class="row" style="display:block"><b>'+z.d+'</b> <button class="lk" onclick="editN(\''+id+'\','+i+')">Edit</button> <button class="lk" onclick="delN(\''+id+'\','+i+')">Delete</button><div style="margin-top:4px;white-space:pre-wrap">'+U(z.t)+'</div></div>').join(''):'<p class="nt">No notes yet.</p>')+'<button class="ad" onclick="addN(\''+id+'\')">Add note</button></div><a class="ad" style="display:flex;align-items:center;justify-content:center" target="_blank" rel="noopener" href="'+askQ('I have a '+s.en+' ('+s.es+') in '+where(p)+', '+SUN[s.sun].toLowerCase()+', in Lagunas. My question: ')+'">Ask Claude about this plant</a>')}
function due(kind){const f=kind=='w'?dueW:dueF,r=all().filter(p=>diff(f(p))<=0).sort((a,b)=>nm(a)<nm(b)?-1:1);return wrap('<p class="lab">Today</p><h1>'+r.length+' to '+(kind=='w'?'water':'feed')+'</h1><p class="it">'+(kind=='w'?'Sample ranges. Water only if the top 3-5 cm of soil is dry':'Yara Mila 12-11-18. Start low. Soil only, not in drought or flooding')+'</p>'+dvd+(r.length?'<button class="b" style="width:100%" onclick="mark(\''+kind+'\')">Mark all done</button>':'<p class="nt">All done for today.</p>')+(D.u&&D.u.k==kind?'<button class="ad" onclick="undo()">Undo last</button>':'')+'<div style="text-align:left;margin-top:10px">'+r.map(p=>'<div class="row"><a href="#/p/'+p.id+'" style="color:#1F1B16">'+nm(p)+'<small>'+where(p)+' &middot; '+(kind=='w'?wAmt(p):dose(p))+(diff(f(p))<0?' &middot; '+when(f(p)):'')+'</small></a><button class="b o" onclick="mark(\''+kind+'\',\''+p.id+'\')">Done</button></div>').join('')+'</div><a class="ad" style="display:flex;align-items:center;justify-content:center" href="#/cal'+kind+'">See calendar</a>')}
function mark(kind,id){const f=kind=='w'?dueW:dueF,ids=id?[id]:all().filter(p=>diff(f(p))<=0).map(p=>p.id);D.u={k:kind,i:ids.map(x=>[x,D[kind][x]])};ids.forEach(x=>D[kind][x]=today());save();route()}
function undo(){if(D.u){D.u.i.forEach(z=>{if(z[1])D[D.u.k][z[0]]=z[1];else delete D[D.u.k][z[0]]});D.u=null;save();route()}}
let cm=0,cd=null;
function cal(kind){const f=kind=='w'?dueW:dueF,iv=kind=='w'?wInt:fI,t=new Date(),b=new Date(t.getFullYear(),t.getMonth()+cm,1),y=b.getFullYear(),mo=b.getMonth(),dim=new Date(y,mo+1,0).getDate(),pd=n=>y+'-'+String(mo+1).padStart(2,'0')+'-'+String(n).padStart(2,'0'),first=pd(1),last=pd(dim),map={};all().forEach(p=>{let d=f(p);if(d<today())d=today();while(d<=last){if(d>=first)(map[d]=map[d]||[]).push(p);d=add(d,iv(p))}});if(!cd||cd<first||cd>last)cd=(today()>=first&&today()<=last)?today():first;const cells=Array(b.getDay()).fill('<span></span>');for(let n=1;n<=dim;n++){const d=pd(n),c=(map[d]||[]).length;cells.push('<button class="'+(d==cd?'on ':'')+(d==today()?'td':'')+'" onclick="cd=\''+d+'\';route()">'+n+'<small>'+(c||'')+'</small></button>')}const q2=map[cd]||[];return wrap('<p class="lab">'+(kind=='w'?'Watering':'Fertilizer')+' calendar</p><h1>'+MO[mo]+' '+y+'</h1>'+dvd+'<div style="display:flex;gap:10px;margin-bottom:10px"><button class="b o" style="flex:1" onclick="cm--;cd=null;route()">&larr; Prev</button><button class="b o" style="flex:1" onclick="cm++;cd=null;route()">Next &rarr;</button></div><div class="cg">'+(LG=='fr'?['D','L','M','M','J','V','S']:LG=='es'?['D','L','M','X','J','V','S']:['S','M','T','W','T','F','S']).map(x=>'<b>'+x+'</b>').join('')+cells.join('')+'</div><div class="sec"><p class="lab">'+cd+'</p>'+dvd+'<div style="text-align:left">'+(q2.map(p=>'<a class="row" href="#/p/'+p.id+'" style="color:#1F1B16"><span>'+nm(p)+'<small>'+where(p)+'</small></span><span>'+(kind=='w'?wAmt(p):dose(p))+'</span></a>').join('')||'<p class="nt">Nothing due.</p>')+'</div></div>')}
function help(){const t=[['Yellow leaves','Overwatering, poor drainage or hunger. Check the soil, then feed lightly.'],['Leaf drop or wilting','Dry roots, waterlogging or transplant shock. Water deeply, shade for a few days.'],['Brown leaf tips','Salt build-up or dry air. Flush the pot with plain water.'],['No flowers or fruit','Too young, too much shade or too much nitrogen. Check first-fruit years.'],['Flowers or fruit dropping','Water stress or heavy rain. Keep watering even.'],['Pests (scale, mites, ants)','Wipe off, spray neem in the evening, repeat weekly.'],['Seedling collapses','Damping off. Less water, more air, clean soil.'],['Roots circling or poking out','Time to repot into the next size up.']];return wrap('<p class="lab">Troubleshooting</p><h1>Help</h1>'+dvd+t.map((x,i)=>'<div class="st"><div class="rn">'+(i+1)+'</div><div><p class="sl">'+x[0]+'</p><p class="sx">'+x[1]+'</p></div></div>').join('')+'<a class="ad" style="display:flex;align-items:center;justify-content:center" target="_blank" rel="noopener" href="'+askQ('I have a question about one of my fruit trees in Lagunas. ')+'">Ask Claude about a tree</a>')}
function addp(){return wrap('<p class="lab">New plant</p><h1>Add</h1>'+dvd+'<input id="an" placeholder="Name (Spanish)"><input id="ae" placeholder="Name (English)"><select id="al"><option value="G">Ground</option><option value="P">Pot</option><option value="B">Nursery bag</option></select><input id="as" placeholder="Size, e.g. 50 L or 8x12 in"><button class="b" style="width:100%;margin-top:12px" onclick="saveAdd()">Save plant</button>')}
function rem(){const r=all().sort((a,b)=>nm(a)<nm(b)?-1:1),h=L.concat(D.x).filter(p=>D.h[p.id]);return wrap('<p class="lab">Remove</p><h1>Remove a plant</h1>'+dvd+'<div style="text-align:left">'+r.map(p=>'<div class="row"><span>'+nm(p)+'<small>'+where(p)+'</small></span><button class="b o" onclick="delp(\''+p.id+'\')">Remove</button></div>').join('')+'</div>'+(h.length?'<div class="sec"><p class="lab">Removed</p>'+dvd+'<div style="text-align:left">'+h.map(p=>'<div class="row"><span>'+nm(p)+'</span><button class="b o" onclick="D.h[\''+p.id+'\']=0;save();route()">Restore</button></div>').join('')+'</div></div>':''))}
function delp(id){if(confirm(T('Remove this plant page? You can restore it later.'))){D.h[id]=1;save();route()}}
function saveAdd(){const es=$('an').value.trim();if(!es)return;const l=$('al').value,sz=$('as').value.trim();D.x.push({id:'x'+Date.now(),k:'',es,en:$('ae').value.trim()||es,loc:l=='G'?'G':l+':'+sz,x:''});save();location.hash='#/plants'}
function addM(id){const v=prompt(T('Height in cm'));if(v&&+v){(D.m[id]=D.m[id]||[]).push({d:today(),h:+v});save();route()}}
function note(id){const v=prompt('Note',D.n[id]||'');if(v!==null){D.n[id]=v;save();route()}}
function share(id){const u=location.href;if(navigator.share)navigator.share({title:'Tree Garden',url:u}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(u);alert(T('Link copied'))}}
function route(){const h=location.hash.slice(2).split('/');$('app').innerHTML=untr(tr(h[0]=='p'?plant(h[1]):h[0]=='photos'?photos(h[1]):h[0]=='water'?due('w'):h[0]=='fert'?due('f'):h[0]=='calw'?cal('w'):h[0]=='calf'?cal('f'):h[0]=='help'?help():h[0]=='add'?addp():h[0]=='remove'?rem():h[0]=='plants'?home():front()));document.documentElement&&(document.documentElement.lang=LG);if(h[0]=='photos')loadPh(h[1]);if(h[0]!=''&&h[0]!=undefined)scrollTo(0,0)}
addEventListener('hashchange',route);route();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
