const fsMon=d=>mname(parseInt(d.slice(5,7))-1)+' '+d.slice(0,4);
function fyRng(y,d){y=String(y||'');if(!d||/Orn|^-|flower/i.test(y))return null;const s=new Date(d+'T12:00:00');if(isNaN(s))return null;let mon=0,m=y.match(/(\d+(?:\.\d+)?)(?:-(\d+(?:\.\d+)?))? months/);if(m)mon=1;else m=y.match(/^(\d+(?:\.\d+)?)(?:-(\d+(?:\.\d+)?))?/);if(!m)return null;const a=+m[1],b=+(m[2]||m[1]),f=x=>{const t=new Date(s);t.setMonth(t.getMonth()+Math.round(mon?x:x*12));return t};return[f(a),f(b)]}
function fruitRows(){const cy=+today().slice(0,4),st=[],ex=[],un=[];all().forEach(p=>{const y=String(info(p).y||'');if(D.fs[p.id]){st.push(p);return}if(/Orn|^-|flower/i.test(y))return;const r=fyRng(y,D.pl[p.id]);if(r)ex.push({p:p,r:r,a:Math.max(cy,r[0].getFullYear())});else un.push(p)});return{st:st,ex:ex,un:un}}
function fyBody(){const cy=+today().slice(0,4),R=fruitRows();if(!FY||FY<cy)FY=cy;const yrs=[];for(let i=0;i<8;i++)yrs.push(cy+i);const nw=R.ex.filter(e=>e.a==FY).sort((x,y)=>byNm(x.p,y.p)),tot=R.st.length+R.ex.filter(e=>e.a<=FY).length;
return '<div id="fyb" class="ch" style="flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding:2px 0">'+yrs.map(y=>'<button style="flex:0 0 auto" class="'+(y==FY?'on':'')+'" onclick="fyPick('+y+')">'+y+'</button>').join('')+'</div>'
+'<p style="font:500 44px/1.1 Lora,serif;margin:10px 0 2px">'+tot+'</p><p class="it" style="margin:0 0 10px">'+L4('plants will fruit in','plantes fructifieront en','plantas darán fruto en')+' '+FY+'</p>'
+(nw.length?'<p class="nt" style="font-size:15px;text-align:left;margin:0 0 2px">'+L4('First fruit expected','Premier fruit prévu','Primer fruto previsto')+' ('+nw.length+')</p><div style="text-align:left">'+nw.map(e=>'<a class="row" href="#/p/'+e.p.id+'"><span>'+nm(e.p)+'</span><span style="color:#8A6A35;font-size:13px;text-align:right">'+(e.r[0].getFullYear()<cy?L4('should be fruiting','devrait fructifier','debería dar fruto'):U(expF(info(e.p).y,D.pl[e.p.id])))+'</span></a>').join('')+'</div>':'<p class="nt" style="font-size:15px">'+L4('No new plant expected this year.','Aucune nouvelle plante prévue cette année.','Ninguna planta nueva prevista este año.')+'</p>')
+(R.st.length?'<p class="sx" style="color:#6B5D4D;margin-top:10px;font-size:14px">+ '+R.st.length+' '+L4('already fruiting','déjà en fruits','ya con fruto')+'</p>':'')
+(R.un.length?'<p class="sx" style="color:#6B5D4D;margin-top:6px;font-size:14px">'+R.un.length+' '+L4('plants have no planting date and are not counted. Set it on each plant page.','plantes sans date de plantation, non comptées. Indiquez-la sur la page de chaque plante.','plantas sin fecha de siembra, sin contar. Indíquela en la página de cada planta.')+'</p>':'')}
function fyPick(y){FY=y;const b=$('fyb'),sl=b?b.scrollLeft:0;$('fyc').innerHTML=untr(tr(fyBody()));const n=$('fyb');if(n)n.scrollLeft=sl}
function fsBody(){const R=fruitRows(),a=all(),st=R.st.slice().sort((x,y)=>D.fs[x.id]<D.fs[y.id]?1:D.fs[x.id]>D.fs[y.id]?-1:byNm(x,y)),opt=a.filter(p=>!D.fs[p.id]).sort(byNm).map(p=>'<option value="'+p.id+'">'+nm(p)+'</option>').join('');
return '<p class="lab">'+L4('Started to fruit','Ont commencé à fructifier','Empezaron a dar fruto')+'</p><p style="font:500 44px/1.1 Lora,serif;margin:10px 0 2px">'+st.length+'</p><p class="it" style="margin:0 0 10px">'+L4('of','sur','de')+' '+a.length+' '+L4('plants have fruited','plantes ont fructifié','plantas han dado fruto')+'</p>'
+'<div style="max-height:340px;overflow-y:auto;text-align:left">'+(st.map(p=>'<div class="row"><a href="#/p/'+p.id+'" style="flex:1;color:#1F1B16">'+nm(p)+'<small style="display:block;color:#6B5D4D">'+L4('First fruit','Premier fruit','Primer fruto')+' '+U(fsMon(D.fs[p.id]))+'</small></a><button class="lk" onclick="fsEdit(\''+p.id+'\')">'+L4('Edit','Modifier','Editar')+'</button><button class="lk" onclick="fsDel(\''+p.id+'\')">'+L4('Remove','Retirer','Quitar')+'</button></div>').join('')||'<p class="nt" style="font-size:15px">'+L4('No plant marked yet. Add the first one below.','Aucune plante marquée. Ajoutez la première ci-dessous.','Ninguna planta marcada. Agregue la primera abajo.')+'</p>')+'</div>'
+'<div style="margin-top:14px"><select id="fsp"><option value="">'+L4('Choose a plant','Choisir une plante','Elegir una planta')+'</option>'+opt+'</select><input id="fsd" type="date" value="'+today()+'"><button class="b" style="width:100%;margin-top:6px" onclick="fsAdd()">'+L4('Mark as fruiting','Marquer en fruits','Marcar con fruto')+'</button></div>'}
function fruitsPage(){return wrap('<p class="lab">Tree Garden</p><h1>'+L4('Fruits','Fruits','Frutas')+'</h1><p class="it">'+L4('Who fruits, year by year','Qui fructifie, année par année','Quién da fruto, año por año')+'</p>'+dvd+'<p class="lab">'+L4('Will fruit','Fructifieront','Darán fruto')+'</p><div id="fyc">'+fyBody()+'</div>'+dvd+'<div id="fsc">'+fsBody()+'</div>')}
const keepY=fn=>{const y=window.scrollY;fn();scrollTo(0,y)};
function fsAdd(){const id=$('fsp').value;if(!id){alert(L3('Choose a plant first.','Choisissez d\'abord une plante.','Elija primero una planta.'));return}let d=$('fsd').value||today();D.fs[id]=d;save();keepY(route)}
function fsEdit(id){const v=prompt(L3('First fruit date (YYYY-MM-DD)','Date du premier fruit (AAAA-MM-JJ)','Fecha del primer fruto (AAAA-MM-DD)'),D.fs[id]||today());if(v===null)return;const t=v.trim();if(/^\d{4}-\d{2}-\d{2}$/.test(t)&&!isNaN(new Date(t+'T12:00:00'))){D.fs[id]=t;save();keepY(route)}else if(t)alert(L3('Use the format YYYY-MM-DD, for example 2026-03-15.','Utilisez le format AAAA-MM-JJ, par exemple 2026-03-15.','Use el formato AAAA-MM-DD, por ejemplo 2026-03-15.'))}
function fsDel(id){if(confirm(L3('Remove this plant from the list of plants that started to fruit?','Retirer cette plante de la liste des plantes qui ont commencé à fructifier ?','¿Quitar esta planta de la lista de plantas que empezaron a dar fruto?'))){delete D.fs[id];save();keepY(route)}}
addEventListener('hashchange',route);route();sync();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
