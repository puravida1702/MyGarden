function front(){const a=all(),w=a.filter(p=>diff(dueW(p))<=0).length,f=a.filter(p=>diff(dueF(p))<=0).length,m=MO[new Date().getMonth()],n=a.filter(p=>{const x=info(p).m,r=x.match(/([A-Z][a-z]{2})-([A-Z][a-z]{2})/);if(/Year/.test(x))return 1;if(!r)return 0;let i=MO.indexOf(r[1]),b=MO.indexOf(r[2]);for(;;i=(i+1)%12){if(MO[i]==m)return 1;if(i==b)return 0}}).length;return wrap('<p class="lab">Welcome to</p><h1>Tree Garden</h1><p class="it">Uvita &middot; '+a.length+' plant pages</p>'+dvd+'<p class="big">Today</p><p class="sx">'+w+' to water &middot; '+f+' to feed</p><p class="sx" style="color:#6B5D4D">'+n+' plants can fruit in '+m+'</p>'+dvd+'<a class="tl" href="#/plants"><b>My plants</b><small>Search and open any plant</small></a><a class="tl" href="#/water"><b>Watering</b><small>'+w+' due today</small></a><a class="tl" href="#/fert"><b>Fertilizer</b><small>Yara Mila 12-11-18 &middot; '+f+' due today</small></a><a class="tl" href="#/help"><b>Troubleshooting</b><small>Symptoms and what to do</small></a><a class="tl" href="#/add"><b>Add a plant</b><small>New tree, pot or bag</small></a>')}
function plant(id){const p=all().find(x=>x.id==id);if(!p)return home();const s=info(p),n=D.n[id];return wrap('<div class="bar"><a class="lk" href="#/plants">&larr; All plants</a><button class="lk" onclick="share(\''+id+'\')">Share &nearr;</button></div><p class="lab" style="margin-top:12px">Plant</p><h1>'+nm(p)+'</h1><p class="it">'+s.en+'</p>'+dvd+'<div style="display:flex;gap:10px"><button class="b" style="flex:1" onclick="D.w[\''+id+'\']=today();save();route()">Watered today</button><button class="b o" style="flex:1" onclick="D.f[\''+id+'\']=today();save();route()">Fertilized</button></div><div class="sec"><p class="lab">At a glance</p>'+dvd+'<div class="tb"><div class="k">Location</div><div class="v">'+where(p)+'</div><div class="k">Sun</div><div class="v">'+SUN[s.sun]+'</div><div class="k">First fruit</div><div class="v">'+s.y+'</div><div class="k">Season</div><div class="v">'+s.m+'</div>'+(p.x?'<div class="k">Plants</div><div class="v">'+p.x+'</div>':'')+'</div></div><div class="sec"><p class="lab">Fruit &amp; use</p>'+dvd+'<p class="nt">'+s.u+'</p></div><div class="sec"><p class="lab">Care</p>'+dvd+'<div class="st"><div class="rn">I</div><div><p class="sl">Watering<span class="tag">SAMPLE</span></p><p class="sx">Every '+wInt(p)+' days. Last: '+(D.w[id]||'—')+' · Next: '+when(dueW(p))+'</p></div></div><div class="st"><div class="rn">II</div><div><p class="sl">Fertilizer<span class="tag">SAMPLE</span></p><p class="sx">Yara Mila 12-11-18, about '+dose(p)+' every 6 weeks. Last: '+(D.f[id]||'—')+' · Next: '+when(dueF(p))+'</p></div></div></div><div class="sec"><p class="lab">Fruit season</p>'+dvd+bars(s.m)+'</div><div class="sec"><p class="lab">Growth</p>'+dvd+chart(id)+'<button class="ad" onclick="addM(\''+id+'\')">Add measurement (cm)</button></div><div class="sec"><p class="lab">Author&rsquo;s note</p>'+dvd+'<p class="nt">'+(n||'No notes yet.')+'</p><button class="ad" onclick="note(\''+id+'\')">Edit note</button></div>')}
function due(kind){const f=kind=='w'?dueW:dueF,r=all().slice().sort((a,b)=>f(a)<f(b)?-1:1);return wrap('<p class="lab">'+(kind=='w'?'Watering':'Fertilizer')+'</p><h1>'+(kind=='w'?'Water':'Feed')+'</h1><p class="it">'+(kind=='w'?'Sample schedule: 3 days for pots, 7 for ground':'Yara Mila 12-11-18, every 6 weeks (sample doses)')+'</p>'+dvd+'<div style="text-align:left">'+r.map(p=>'<div class="row"><a href="#/p/'+p.id+'" style="color:#1F1B16">'+nm(p)+'<small>'+where(p)+(kind=='f'?' · '+dose(p):'')+' · '+when(f(p))+'</small></a><button class="b o" onclick="D.'+kind+'[\''+p.id+'\']=today();save();route()">Done</button></div>').join('')+'</div>')}
function help(){const t=[['Yellow leaves','Overwatering, poor drainage or hunger. Check the soil, then feed lightly.'],['Leaf drop or wilting','Dry roots, waterlogging or transplant shock. Water deeply, shade for a few days.'],['Brown leaf tips','Salt build-up or dry air. Flush the pot with plain water.'],['No flowers or fruit','Too young, too much shade or too much nitrogen. Check first-fruit years.'],['Flowers or fruit dropping','Water stress or heavy rain. Keep watering even.'],['Pests (scale, mites, ants)','Wipe off, spray neem in the evening, repeat weekly.'],['Seedling collapses','Damping off. Less water, more air, clean soil.'],['Roots circling or poking out','Time to repot into the next size up.']];return wrap('<p class="lab">Troubleshooting</p><h1>Help</h1>'+dvd+t.map((x,i)=>'<div class="st"><div class="rn">'+(i+1)+'</div><div><p class="sl">'+x[0]+'</p><p class="sx">'+x[1]+'</p></div></div>').join(''))}
function addp(){return wrap('<p class="lab">New plant</p><h1>Add</h1>'+dvd+'<input id="an" placeholder="Name (Spanish)"><input id="ae" placeholder="Name (English)"><select id="al"><option value="G">Ground</option><option value="P">Pot</option><option value="B">Nursery bag</option></select><input id="as" placeholder="Size, e.g. 50 L or 8x12 in"><button class="b" style="width:100%;margin-top:12px" onclick="saveAdd()">Save plant</button>')}
function saveAdd(){const es=$('an').value.trim();if(!es)return;const l=$('al').value,sz=$('as').value.trim();D.x.push({id:'x'+Date.now(),k:'',es,en:$('ae').value.trim()||es,loc:l=='G'?'G':l+':'+sz,x:''});save();location.hash='#/plants'}
function addM(id){const v=prompt('Height in cm');if(v&&+v){(D.m[id]=D.m[id]||[]).push({d:today(),h:+v});save();route()}}
function note(id){const v=prompt('Note',D.n[id]||'');if(v!==null){D.n[id]=v;save();route()}}
function share(id){const u=location.href;if(navigator.share)navigator.share({title:'Tree Garden',url:u}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(u);alert('Link copied')}}
function route(){const h=location.hash.slice(2).split('/');$('app').innerHTML=h[0]=='p'?plant(h[1]):h[0]=='water'?due('w'):h[0]=='fert'?due('f'):h[0]=='help'?help():h[0]=='add'?addp():h[0]=='plants'?home():front();if(h[0]!=''&&h[0]!=undefined)scrollTo(0,0)}
addEventListener('hashchange',route);route();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
