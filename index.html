function photos(id){const p=all().find(x=>x.id==id);if(!p)return home();const lb=(t,cap)=>'<label class="b'+(cap?' o':'')+'" style="flex:1;display:flex;align-items:center;justify-content:center;min-height:52px;text-align:center;cursor:pointer">'+t+'<input type="file" accept="image/*" '+(cap?'capture="environment" ':'multiple ')+'hidden onchange="addPh(\''+id+'\',this)"></label>';return wrap('<div class="bar"><a class="lk" href="#/p/'+id+'">&larr; '+nm(p)+'</a></div><p class="lab" style="margin-top:12px">Photos</p><h1>'+nm(p)+'</h1><p class="it">'+info(p).en+'</p>'+dvd+'<div style="display:flex;gap:10px">'+lb('From gallery',0)+lb('Take photo',1)+'</div><p class="nt" id="phn" style="margin-top:12px">Loading...</p><div id="phg" class="pg2"></div>')}
